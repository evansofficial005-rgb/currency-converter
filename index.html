<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>currency-converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div>
            <h1 class="header">Currency-converter</h1>
        </div>
    </header>
    <main>
        <!--lets learn how to write an input form-->
        <div>
          <label for="amount">Amount</label>
        <input type="number" id="amount" value="100" min="0.01" step="any" >

        <label for="from-currency">From</label>
        <select  id="from-currency">
            <option value="USD" selected>USD</option>
            <option value="KES">KES</option>
            <option value="EUR">EUR</option>
            <option value="GBP">GBP</option>
        </select>

        <button type="button" id="swap-btn">Swap</button>

        <label for="to-currency">To</label>
        <select  id="to-currency">
            <option value="USD">USD</option>
            <option value="KES"selected>KES</option>
            <option value="EUR">EUR</option>
            <option value="GBP">GBP</option>
        </select>

        <button type="button"  id="convert-btn">Convert</button>

        <p id="result-output"></p>
        <p id="rate-output"></p>


        </div>
        
        
    </main>
    <footer class="footer">
        <h3>&copy; 2026 Developed by evans maingi</h3>
    </footer>
    <script src="script.js"></script>

<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
